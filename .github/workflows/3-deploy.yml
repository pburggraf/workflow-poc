name: "3 · Deploy"

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run-ID des Build-Laufs"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: poc-artifact
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Deploy
        run: |
          echo "DEPLOY – Artefakt-Inhalt:"
          cat artifact.txt
