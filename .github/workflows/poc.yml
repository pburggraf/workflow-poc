name: PoC Multi-Stage (manuell)

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Freitext, wird in jeder Stage ausgegeben"
        required: false
        default: "Hallo aus dem Pott"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build-Stage
        run: |
          echo "BUILD läuft – ${{ inputs.message }}"
          echo "build-$(date +%s)" > artifact.txt
      - uses: actions/upload-artifact@v4
        with:
          name: poc-artifact
          path: artifact.txt

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: poc-artifact
      - name: Test-Stage
        run: |
          echo "TEST läuft – Artefakt-Inhalt:"
          cat artifact.txt

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: approval   # hier wartet der Workflow auf manuelle Freigabe
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: poc-artifact
      - name: Deploy-Stage
        run: |
          echo "DEPLOY freigegeben und läuft – ${{ inputs.message }}"
          cat artifact.txt
